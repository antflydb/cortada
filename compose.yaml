services:
  cortada:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-}"
        NEXT_PUBLIC_APP_MARK: "${NEXT_PUBLIC_APP_MARK:-}"
        NEXT_PUBLIC_APP_LOGO_URL: "${NEXT_PUBLIC_APP_LOGO_URL:-}"
        NEXT_PUBLIC_APP_EYEBROW: "${NEXT_PUBLIC_APP_EYEBROW:-}"
        NEXT_PUBLIC_APP_HEADLINE: "${NEXT_PUBLIC_APP_HEADLINE:-}"
        NEXT_PUBLIC_APP_DESCRIPTION: "${NEXT_PUBLIC_APP_DESCRIPTION:-}"
        NEXT_PUBLIC_APP_DEPLOY_NOTE: "${NEXT_PUBLIC_APP_DEPLOY_NOTE:-}"
        NEXT_PUBLIC_APP_FOOTER: "${NEXT_PUBLIC_APP_FOOTER:-}"
        NEXT_PUBLIC_APP_TITLE: "${NEXT_PUBLIC_APP_TITLE:-}"
        NEXT_PUBLIC_APP_META_DESCRIPTION: "${NEXT_PUBLIC_APP_META_DESCRIPTION:-}"
        NEXT_PUBLIC_REPOSITORY_URL: "${NEXT_PUBLIC_REPOSITORY_URL:-}"
        NEXT_PUBLIC_LICENSE_NAME: "${NEXT_PUBLIC_LICENSE_NAME:-}"
        NEXT_PUBLIC_BRAND_PRIMARY: "${NEXT_PUBLIC_BRAND_PRIMARY:-}"
        NEXT_PUBLIC_BRAND_ACCENT: "${NEXT_PUBLIC_BRAND_ACCENT:-}"
        NEXT_PUBLIC_BRAND_BACKGROUND: "${NEXT_PUBLIC_BRAND_BACKGROUND:-}"
        NEXT_PUBLIC_BRAND_SURFACE: "${NEXT_PUBLIC_BRAND_SURFACE:-}"
        NEXT_PUBLIC_BRAND_TEXT: "${NEXT_PUBLIC_BRAND_TEXT:-}"
        NEXT_PUBLIC_BRAND_MUTED: "${NEXT_PUBLIC_BRAND_MUTED:-}"
        NEXT_PUBLIC_BRAND_BORDER: "${NEXT_PUBLIC_BRAND_BORDER:-}"
        NEXT_PUBLIC_THEME_FONT: "${NEXT_PUBLIC_THEME_FONT:-}"
        NEXT_PUBLIC_THEME_CORNERS: "${NEXT_PUBLIC_THEME_CORNERS:-}"
        NEXT_PUBLIC_SHOW_PROJECT_LINKS: "${NEXT_PUBLIC_SHOW_PROJECT_LINKS:-}"
        NEXT_PUBLIC_SHOW_ARCHITECTURE: "${NEXT_PUBLIC_SHOW_ARCHITECTURE:-}"
        NEXT_PUBLIC_SHOW_ANTFLY_ATTRIBUTION: "${NEXT_PUBLIC_SHOW_ANTFLY_ATTRIBUTION:-}"
    # Server settings are loaded at runtime. NEXT_PUBLIC_* values from the same
    # file affect only the build arguments above and cannot rebrand a built image.
    env_file:
      - .env.local
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    restart: unless-stopped
